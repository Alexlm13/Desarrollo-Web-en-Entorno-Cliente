    <script>
        let nombreCompleto="Alejandro López Martínez"
        function nombreApellidos(nombreCompleto){ 
            debugger;
            let partes = nombreCompleto.split(" ");
            let tamanioNombre=partes[0]+partes[1]+partes[2];
            let mayus=nombreCompleto.toUpperCase();
            let minus=nombreCompleto.toLowerCase();
            console.log(`El tamaño del nombre más apellidos es: ${tamanioNombre.length}`);
            console.log(`La cadena en minúsculas: ${minus} y en mayúsculas: ${mayus}`);
            console.log(`
                Nombre: ${partes[0]}
                Apellido 1: ${partes[1]}
                Apellido 2: ${partes[2]}
            `)
        }

        nombreApellidos(nombreCompleto)
    </script>
