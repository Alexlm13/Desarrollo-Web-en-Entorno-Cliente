<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio9</title>
</head>

<body>
    <script>
        let frase = "Voy a escribir una frase algo larga";

        function contarVocales(frase) {
            let cont = 0;

            for (let i = 0; i < frase.length; i++) {
                switch (frase[i].toLocaleLowerCase()) {
                    case "a":
                        cont++
                        break;
                    case "e":
                        cont++
                        break;
                    case "i":
                        cont++
                        break;
                    case "o":
                        cont++
                        break;
                    case "u":
                        cont++
                        break;
                }

            }
            document.write(`En total hay ${cont} vocales`);
        }

        contarVocales(frase);

    </script>
</body>

</html>
