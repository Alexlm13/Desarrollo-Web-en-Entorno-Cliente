<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3</title>
</head>
<body>
    <input type="button" value="Haz clic aquí" onclick="crearVentana()">
    
    <script>
        let ventana;
        function crearVentana(){
            for (let i = 1; i <= 5; i++) {
                ventana=window.open("","","height=350 width=350");
                ventana.document.write(`<h1>Ventana ${i}</h1><input type="button" value="Cerrar" onclick="window.close()">`);
            }
        }
    </script>
</body>
