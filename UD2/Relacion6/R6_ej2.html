<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>

<body>
    <table border="1">
        <tr>
            <th>Información</th>
            <th>Valor</th>
        </tr>
        <tr>
            <td>Ancho</td>
            <td id="ancho"></td>
        </tr>
        <tr>
            <td>Alto</td>
            <td id="alto"></td>
        </tr>
        <tr>
            <td>Color</td>
            <td id="color"></td>
        </tr>
        <tr>
            <td>Pixel</td>
            <td id="pixel"></td>
        </tr>
    </table>

    <script>
        document.getElementById("ancho").innerHTML = screen.width;
        document.getElementById("alto").innerHTML = screen.height;
        document.getElementById("color").innerHTML = screen.colorDepth;
        document.getElementById("pixel").innerHTML = screen.pixelDepth;
    </script>
</body>

</html>
