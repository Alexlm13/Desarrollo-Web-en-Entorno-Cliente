<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio1</title>
</head>
<body>
    <script>
        let numeros=[]
        for (let i = 0; i <= 19; i++) {
            numeros[i]=Math.floor(Math.random()*100);
        }

        let ordenados=(v)=>v.filter((num,i)=>v.indexOf(num)===i).sort((a,b)=>a-b);

        document.write(`Números sin ordenar: ${numeros} <br>`);
        document.write(`Números ordenados: ${ordenados(numeros)} `);
    </script>
</body>
</html>
