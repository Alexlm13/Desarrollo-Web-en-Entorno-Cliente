<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./js/scripts.js"></script>
    <title>Document</title>
</head>
<body>
    <script>
        let nombres = ["Juan", "Ana", "Javier", "Laura", "Julia", "Pedro", "José", "Marta", "Jorge", "Lucía"];


        document.write(`${nombres}<br>`);
        document.write(nombres.filter(nombre=>nombre.startsWith("J")).map(nombre=>nombre[0].toUpperCase()).sort());
    </script>
</body>
</html>
