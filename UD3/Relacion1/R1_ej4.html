<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let r=prompt("Introduzca el radio de una esfera");
        let volumenEsfera=(r) => (4/3)*Math.PI*(r**3);

        document.write(`El volumen de la esfera es: ${volumenEsfera(r)}`);
    </script>
</body>
</html>
