<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /**
        * @name toHackerSpeak
        * @description Convierte un string a "Hacker Speak". Para hacerlo, tiene que transformar las "a" en 4, las "e" en 3, las "i"
        * en 1, las "o" en 0 y las "s" en 5
        *
        * @param {string} text
        * @returns {String} - El texto convertido a "Hacker Speak"
        *
        * @example
        * toHackerSpeak("I'm a hacker now") // returns "1'm 4 h4ck3r n0w"
        */

        function toHackerSpeak(text){
            let nuevaCadena="";
            for (const letra of text) {

                if (letra=="a"||letra=="A") {
                    nuevaCadena+="4";
                }else if(letra=="e"||letra=="E"){
                    nuevaCadena+="3";
                }else if(letra=="i"||letra=="I"){
                    nuevaCadena+="1";
                }else if(letra=="o"||letra=="O"){
                    nuevaCadena+="0";
                }else if(letra=="s"||letra=="S"){
                    nuevaCadena+="5";
                }else{
                    nuevaCadena+=letra;
                }

            }

            return nuevaCadena;
        }

        console.log(toHackerSpeak("I'm a hacker now"))
    </script>
</body>
</html>
