<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3</title>
</head>
<body>
    <script>
        let radio=prompt("Dame el radio de un círculo");
        function circumference(radio){
            let resultado=Math.round(2*3.14*radio);
            document.write(`<p>La circunferencia es ${resultado}</p>`)
        }
        circumference(radio);

        function area(radio){
            let resultado=3.14*radio^2;
            document.write(`El área es ${resultado}`)
        }
        area(radio);
    </script>
</body>
</html>
