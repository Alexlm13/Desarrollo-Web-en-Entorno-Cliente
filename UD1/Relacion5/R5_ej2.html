<!DOCTYPE html>

<body>
    <script>
        function squareAndSum(...nums){
            let suma=0;
            for (let i = 0; i < nums.length; i++) {
                    suma+=nums[i]*nums[i];
            }
            document.write(`${suma}<br>`);
            return suma;
        }
        console.log(squareAndSum(2,4,3));
        console.log(squareAndSum(1,2));

    </script>
</body>
