<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let nColumnas;
        let nFilas;
        let height;
        let width;

        nColumnas = prompt("Numero de columnas");
        nFilas = prompt("Numero de filas")
        height = prompt("Altura");
        width = prompt("Anchura");

        /*
            Para que funcione habia que quitar el width="200" de la etiqueta <table>
            en el ejemplo aparece y me fallaba a la hora de poner la anchura de la tabla
            siempe me salia la misma anchura.    
        */
        document.write(`
        <table border="0" cellspacing="2" bgcolor="black">    
        `)

        for (let fil = 0; fil < nFilas; fil++) {
            document.write(`<tr bgcolor="white" height="${height}">`);
            for (let col = 0; col < nColumnas; col++) {
                document.write(`<td width="${width}">&nbsp;</td>`);
            }
        }

        document.write(`
        </tr>
        </table>
        `)    
    </script>
</body>

</html>
