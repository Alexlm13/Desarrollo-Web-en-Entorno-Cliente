<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio6</title>
</head>
<body>
    <script>
        let n;
        let n2;
        let resultado;

        for (n = 1; n <= 10; n++) {
            document.write(`<b>Tabla del ${n}</b><br>`);
            for(n2=1; n2<=10; n2++) {
                resultado=n*n2
                document.write(`${n}x${n2}=${resultado}<br>`)
            }
            document.write(`<br>`)
        }
        
    </script>
</body>
</html>
