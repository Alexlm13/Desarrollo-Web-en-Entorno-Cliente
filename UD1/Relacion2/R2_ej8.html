<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio8</title>
</head>

<body>
    <script>
        document.write(`
        <table border="0" cellspacing="1" bgcolor="black">    
        `)
        for (let alto = 0; alto < 8; alto++) {
            document.write(`<tr height="50">`);
            for (let ancho = 0; ancho < 8; ancho++) {
                if ((alto+ancho)%2==0) {
                    document.write('<td width="50" height="50" bgcolor="black"></td>');
                }else{
                    document.write('<td width="50" height="50" bgcolor="white"></td>');
                }
                
            }
        }
        document.write(`
        </tr>
        </table>
        `) 
    </script>
</body>

</html>
