<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //let num=prompt("Escriba un número");
        function divisible(num,num2){
            let resultado;
            if((num%3==0) && (num2%3==0)){
                document.write(`Los números son divisibles entre 3`);
            }else if((num%3==0) && !(num2%3==0)){
                document.write(`El número ${num} es divisible entre 3 pero ${num2} no`);
            }else if(!(num%3==0) && (num2%3==0)){
                document.write(`El número ${num2} es divisible entre 3 pero ${num} no`);
            }else{
                document.write(`Los números no son divisibles entre 3`);
            }
        }
        divisible(15,3);
    </script>
</body>
</html>
