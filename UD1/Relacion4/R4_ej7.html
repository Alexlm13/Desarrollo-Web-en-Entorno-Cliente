<!DOCTYPE html>

</head>
<body>
    <script>
        function divisibleEntre(num1, num2){
            let resultado;

            if(num1%num2==0){
                resultado=num1/num2;
                document.write(`Si son divisibles, el resultado es: ${resultado}`);
            } else {
                document.write(`No son divisibles`);
            }
        }
        divisibleEntre(3, 15)
    </script>
</body>
