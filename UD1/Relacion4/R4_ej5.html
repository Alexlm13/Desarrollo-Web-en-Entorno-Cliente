<body>
    <script>
        function sumEveryOther(...nums){
            let suma=0;
            for (let i = 0; i < nums.length; i++) {
                if(nums[i]%2!=0 && typeof nums[i]==="number"){
                    suma+=nums[i];
                }
            }
            document.write(`<p>${suma}</p>`);
        }
        sumEveryOther(5,6,3,4,1);
        sumEveryOther(10,2,11,);
    </script>
</body>
