<body>
    <script>
        function tieneTresDigitos(valor){
            if((valor>=100 && valor<=999)||(valor<=-100 && valor>=-999)){
                document.write(`Si tiene 3 dígitos`);
            }else{
                document.write(`No tiene 3 dígitos`);
            }
        }

        tieneTresDigitos(612);
    </script>
</body>
