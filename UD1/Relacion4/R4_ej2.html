<body>
    <script>
        function addOnlyNums(...nums){
            let suma=0;
            for (let i = 0; i < nums.length; i++) {
                if(typeof nums[i]==="number"){
                    suma+=nums[i];
                }/*else{
                    document.write(nums[i]);
                }*/
            }
            document.write(suma);
        }
        addOnlyNums(1,'cat',3,4);
    </script>
