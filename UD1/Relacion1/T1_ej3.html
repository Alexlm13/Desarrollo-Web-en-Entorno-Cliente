<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio3</title>
</head>
<body>
    <script>
        let edad;
        edad=prompt("Introduzca una edad");

        if(edad>18){
            document.write("absoluto")
        }else if(edad>=16 || edad==18){
            document.write("juvenil")
        }else if(edad==14 || edad==15){
            document.write("cadete")
        }else if(edad==12 || edad==13){
            document.write("infantil")
        }else if(edad==10 || edad==11){
            document.write("alevín")
        }else if(edad==8 || edad==9){
            document.write("benjamín")
        }else if(edad<8){
            document.write("Demasiado joven")
        }
            
    </script>
</body>
</html>
