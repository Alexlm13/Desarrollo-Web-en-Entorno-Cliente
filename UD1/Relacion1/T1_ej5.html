<body>
    <script>
        let countdown=prompt("Introduce un número para iniciar la cuenta atrás");
        while (countdown>0) {
            alert(countdown+"... ")
            countdown--;
            //countdown++;
        }
        /*La condición del bucle dice que si la variable es mayor que 0 se ejecutará 
        por lo tanto si la dejamos como está cuando llegue a 0 parará
        pero si cambiamos a que la variable sume nunca va a parar ya que nunca llegará a 0
        */
    </script>
