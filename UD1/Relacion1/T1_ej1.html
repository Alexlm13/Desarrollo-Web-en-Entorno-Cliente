<body>
    <script>
        /*
            Juan es menor que juan porque se compara
            carácter a carácter según su unicode
            J=74 y j=106
        */
        document.write(`
            <p>La operacion 20==20 es ${20==20}</p>
            <p>La operacion 20===20 es ${20===20}</p>
            <p>La operacion 20===20.0 es ${20===20.0}</p>
            <p>Es "Juan"=="juan"? ${"Juan"=="juan"}</p>
            <p>Es "Juan">"juan"? ${"Juan">"juan"}</p>
            <p>Es "Juan"<"juan"? ${"Juan"<"juan"}</p>
            <p>Es "123"==123? ${"123"==123}</p>
            <p>Es "123"===123? ${"123"===123}</p>
            <p>Es parseInt("123")==123? ${parseInt("123")==123}</p>
        `)
    </script>
